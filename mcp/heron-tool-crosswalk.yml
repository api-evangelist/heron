source: >-
  Derived by binding the three live MCP tools returned by
  POST https://docs.herondata.io/mcp (tools/list, HTTP 200) against the 272 operations in
  openapi/heron-openapi.json (Heron Data API, fetched from https://app.herondata.io/swagger).
description: >-
  Heron's MCP surface and its REST surface do NOT overlap. The MCP server is a
  documentation-retrieval server (search, read, feedback) hosted on docs.herondata.io;
  the REST API is the product surface on app.herondata.io. Every MCP tool is therefore
  mcp_only, and every one of the 272 REST operations is rest_only. This is the honest
  result and it is the useful one: an agent cannot drive Heron through MCP today, and
  the crosswalk records exactly that gap rather than inventing bindings.
surfaces:
  openapi:
    path: openapi/heron-openapi.json
    title: Heron Data API
    version: '2021-07-19'
    server: https://app.herondata.io
    auth: apiKey (x-api-key header)
    operations: 272
    gated: false
  mcp:
    url: https://docs.herondata.io/mcp
    tools: 3
    auth: none
    gated: false
    scope: documentation only
  graphql:
    present: false
crosswalk: []
mcp_only:
  - tool: search_heron
    reason: >-
      Documentation search over docs.herondata.io. There is no REST operation in the Heron
      Data API that searches documentation — the nearest REST search operations
      (/api/merchants/search, /api/funders/search) search product data, not docs, so they
      are not a binding.
  - tool: query_docs_filesystem_heron
    reason: >-
      Read-only virtual filesystem over documentation pages and specs. No REST equivalent;
      the operation it most resembles is fetching the published spec at /swagger, which is
      not an API operation.
  - tool: submit_feedback
    reason: >-
      Submits documentation feedback to the Heron docs team. Distinct from the product
      feedback endpoints (/api/enrichment_feedback/*), which record merchant and category
      corrections on transactions, not documentation defects.
