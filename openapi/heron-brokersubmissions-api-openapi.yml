        federal_tax_id:
          type:
          - string
          - 'null'
        industry_type:
          type:
          - string
          - 'null'
        loan_purpose:
          type:
          - string
          - 'null'
        monthly_revenue:
          type:
          - number
          - 'null'
        naics:
          type:
