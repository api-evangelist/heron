          - string
          - 'null'
        name:
          description: The name of the NamedDate
          enum:
          - end_user_created
          - end_user_last_updated
          - last_transaction
          - end_user_last_enriched
          - last_data_source_end_date_or_transaction_timestamp
          - custom_date
          example: last_transaction
          type: string
      type: object
    EndUserStatsOutputSchema:
      properties:
