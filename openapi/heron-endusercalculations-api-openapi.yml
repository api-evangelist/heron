          description: 'Human-readable account label for display: the last four digits of the account number (falling back to the account name). Not unique and not a key; use account_id to join.'
          example: '7505'
          type:
          - string
          - 'null'
        is_computed:
          description: Whether the balance has been imputed using forward fill
          type: boolean
        is_latest:
          description: Whether the date is the latest non-imputed balance for the account
          type: boolean
        timestamp:
          description: Timestamp of the latest transaction
          format: date-time
          type: string
      type: object
    PnlMetric:
