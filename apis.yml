aid: heron
name: Heron
description: >-
  Heron (Heron Data) is a financial-services document-automation and cashflow-underwriting
  platform. Its API and AI platform handle document intake, classification, parsing and
  validation, enrichment, policy/rule evaluation, and CRM sync across 50+ document types
  (bank statements, tax returns, financial statements, ACORD forms). Lenders, MCA funders,
  brokers, and insurers upload documents for an "end user" (company), then read back parsed
  transactions, a Heron Score, scorecards, cashflow P&L, anomaly/fraud checks, and decline
  analytics. Heron publishes an OpenAPI 3.0 contract at app.herondata.io/swagger covering 226
  paths and 272 operations, a conformant A2A agent card and a published Agent Skill on its
  documentation host, and a live unauthenticated MCP endpoint for documentation retrieval. The
  REST API authenticates with an x-api-key header, signals rate limits via x-ratelimit-*
  headers, and pushes async progress through webhooks. Backed by Insight Partners.
url: https://raw.githubusercontent.com/api-evangelist/heron/refs/heads/main/apis.yml
accessModel:
  pricing: enterprise
  onboarding: sales
  trial: true
  try_now: false
  public: false
  label: Book a demo; credentials issued by Heron
  confidence: high
  note: >-
    No pricing or plans page exists (both /pricing and /plans return 404) and the only
    commercial call to action is Book a demo. Development credentials are issued for trial
    and onboarding; production credentials are issued separately on request. Corrected from
    the earlier derived guess of self-serve signup.
  source:
  - plans/heron-plans-pricing.yml
  - authentication/heron-authentication.yml
  generated: '2026-08-14'
  method: searched
image: https://cdn.prod.website-files.com/675862616b5e61c9450cfef0/677e4fc1e48ddcd5917c71ca_home-og-img.jpg
