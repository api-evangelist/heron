aid: heron
name: Heron
description: >-
  Heron (Heron Data) is a financial-services document-automation and cashflow-underwriting
  platform. Its API and AI platform handle document intake, classification, parsing and
  validation, enrichment, policy/rule evaluation, and CRM sync across 50+ document types
  (bank statements, tax returns, financial statements, ACORD forms). Lenders, MCA funders,
  brokers, and insurers upload documents for an "end user" (company), then read back parsed
  transactions, a Heron Score, scorecards, cashflow P&L, anomaly/fraud checks, and decline
  analytics. The REST API authenticates with an x-api-key header, signals rate limits via
  x-ratelimit-* headers, and pushes async progress through webhooks. Backed by Insight Partners.
