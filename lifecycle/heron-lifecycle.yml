description: >-
  Heron operational lifecycle: a public status page with per-component uptime, a monthly
  product changelog started in 2025, a credential-level development/production separation, and
  deprecations announced inline on the operations themselves. There is still no formal dated
  API-versioning scheme and no standalone deprecation-policy page.
versioning:
  scheme: unversioned /api path; individual endpoints carry variant suffixes (e.g. /files/v2)
  current: '2021-07-19'
  current_source: openapi/heron-openapi.json info.version
  note: >-
    The declared spec version is a 2021 date stamp that has not moved while the product shipped
    monthly through 2025-08, so it cannot be used to detect contract change.
