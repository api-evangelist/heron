description: >-
  Core Heron entities for financial-services document automation and cashflow underwriting.
  The EndUser (a company being underwritten, id prefix eus_) is the hub: files and data-source
  connections feed transactions, transactions drive calculations (Heron Score, scorecard,
  cashflow P&L, anomalies, positions) and policy/rule evaluations, and brokers/funders sit on
  top for MCA and lending submission flows. Workflows orchestrate the whole pipeline and
  enrichers attach third-party intelligence to the end user.
id_scheme:
  style: prefixed opaque ids exposed as heron_id
  prefixes:
    end_user: eus_
    iso_application: iso_
    broker_submission: sub_
  dual_addressing: >-
    63 operations accept end_user_id_or_heron_id — either the customer's own end_user_id or
    Heron's heron_id resolves the same record.
top_reference_fields:
